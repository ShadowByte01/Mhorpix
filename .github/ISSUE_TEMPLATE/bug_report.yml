name: Bug Report
description: Report something broken
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Bot version / commit
    validations:
      required: false
